plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pdfedit'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    // Runs the PaddleOCR models (src/main/resources/ocr) for text recognition of scanned pages.
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.31.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// The React frontend is built with npm and packaged into the boot jar as static resources, so a
// single jar serves both the UI and the API. Only bootJar depends on this: `gradlew test` and
// `bootRun` (used together with the Vite dev server) need no Node installation.
// Pass -PprebuiltFrontend to package an already built ../frontend/dist without invoking npm.
def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
def frontendDir = layout.projectDirectory.dir('../frontend').asFile
def npmCommand = { List<String> args -> isWindows ? ['cmd', '/c', 'npm'] + args : ['npm'] + args }

tasks.register('npmInstall', Exec) {
    workingDir frontendDir
    commandLine npmCommand(['ci'])
    inputs.file(new File(frontendDir, 'package-lock.json'))
    outputs.dir(new File(frontendDir, 'node_modules'))
}

tasks.register('frontendBuild', Exec) {
    dependsOn 'npmInstall'
    workingDir frontendDir
    commandLine npmCommand(['run', 'build'])
    inputs.dir(new File(frontendDir, 'src'))
    inputs.dir(new File(frontendDir, 'public'))
    inputs.files(fileTree(dir: frontendDir, includes: ['index.html', 'package.json', 'vite.config.ts', 'tsconfig*.json']))
    outputs.dir(new File(frontendDir, 'dist'))
}

tasks.named('bootJar') {
    if (!project.hasProperty('prebuiltFrontend')) {
        dependsOn 'frontendBuild'
    }
    from(new File(frontendDir, 'dist')) {
        into 'BOOT-INF/classes/static'
    }
}

// The Windows installer's jar: ONNX Runtime with only its Windows library (about 6 MB of the jar's 49; the rest
// is Linux and macOS). Development and the e2e tests keep using bootJar, which has them all.
def isOnnxRuntime = { File f -> f.name ==~ /onnxruntime-\d.*\.jar/ }

tasks.register('onnxRuntimeWindows', Jar) {
    archiveFileName = 'onnxruntime-windows.jar'
    destinationDirectory = layout.buildDirectory.dir('onnxruntime')
    from({ zipTree(configurations.runtimeClasspath.find(isOnnxRuntime)) }) {
        exclude 'ai/onnxruntime/native/linux-*/**', 'ai/onnxruntime/native/osx-*/**'
    }
}

tasks.register('bootJarWindows', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    description = 'The boot jar for the Windows installer (ONNX Runtime for Windows only).'
    if (!project.hasProperty('prebuiltFrontend')) {
        dependsOn 'frontendBuild'
    }
    def standard = tasks.named('bootJar', org.springframework.boot.gradle.tasks.bundling.BootJar)
    mainClass = standard.flatMap { it.mainClass }
    targetJavaVersion = standard.flatMap { it.targetJavaVersion }
    classpath = sourceSets.main.runtimeClasspath.filter { !isOnnxRuntime(it) } + files(tasks.named('onnxRuntimeWindows'))
    from(new File(frontendDir, 'dist')) {
        into 'BOOT-INF/classes/static'
    }
    archiveClassifier = 'windows'
}
