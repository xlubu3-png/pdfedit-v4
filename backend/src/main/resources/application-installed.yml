# Active only in the Windows installer build (-Dspring.profiles.active=installed): the launcher has no
# console, so a log file is the only way to find out why the app did not start.
logging:
  file:
    name: ${user.home}/WINTECH_PDF/app.log

# Only the installed app updates itself: from the newest GitHub release of app.update.repo.
app:
  update:
    enabled: true
